[package]
name = "makerdash"
version = "1.0.0"
description = "MakerDash - 创客数据仪表盘"
authors = ["huqingyuan-Python"]
license = "MIT"
repository = "https://github.com/huqingyuan-Python/MakerDash"
edition = "2021"

[lib]
name = "makerdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4.6"
bluetooth-serial-port = "0.5"
csv = "1.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true